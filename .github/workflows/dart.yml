name: Dart quality

on: [push, pull_request]

permissions:
  contents: read

concurrency:
  group: dart-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        projects: [app, api, tools]
    defaults:
      run:
        working-directory: ${{ matrix.projects }}
    steps:
      - name: ⬆️ Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version-file: app/pubspec.yaml
          cache: true
      - name: Print Dart SDK version
        run: |
          dart --version
          flutter --version
      - name: Install dependencies
        run: flutter pub get
      - name: Run flutter gen-l10n
        if: matrix.projects == 'app'
        run: |
          flutter gen-l10n
          dart format lib/src/generated
      - name: TEMP format patch
        if: matrix.projects == 'app'
        continue-on-error: true
        run: |
          dart format lib test > /dev/null
          echo AMAZE-PATCH-BEGIN
          git diff
          echo AMAZE-PATCH-END
      # Uncomment this step to verify the use of 'dart format' on each commit.
      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed ${{ matrix.projects == 'tools' && '.' || 'lib' }}
      # Consider passing '--fatal-infos' for slightly stricter analysis.
      - name: Analyze project source
        run: flutter analyze --fatal-infos
      - name: Run build_runner
        if: matrix.projects != 'tools'
        run: dart run build_runner build --delete-conflicting-outputs
      - name: Run format for generated files
        if: matrix.projects != 'tools'
        run: dart format .
      - name: Test for git changes
        run: git diff --exit-code -- . ':!lib' ':!test'
      - name: Run Flutter tests
        if: matrix.projects == 'app'
        run: flutter test
      - name: TEMP print screenshots
        if: ${{ always() && matrix.projects == 'app' }}
        continue-on-error: true
        run: |
          for f in build/amaze_screenshots/*.png; do
            echo "AMAZE-SHOT-BEGIN $(basename "$f")"
            base64 -w0 "$f"
            echo
            echo AMAZE-SHOT-END
          done
      - name: Upload aMaze editor screenshots
        if: ${{ always() && matrix.projects == 'app' }}
        uses: actions/upload-artifact@v7
        with:
          name: amaze-screenshots
          path: app/build/amaze_screenshots/
          if-no-files-found: ignore
      - name: Run Dart tests
        if: matrix.projects == 'api'
        run: dart test
