name: aMaze web preview

# Builds the web app for the aMaze branches and publishes it to the
# gh-pages branch, so the UI can be reviewed in a browser.
on:
  push:
    branches:
      - feature/amaze-editor-shell
      - amaze/develop
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: amaze-web-preview
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version-file: app/pubspec.yaml
          cache: true
      - name: Get dependencies
        run: flutter pub get
      - name: Build web
        run: >
          flutter build web --release
          --base-href /${{ github.event.repository.name }}/
          --dart-define=flavor=nightly
          --dart-define=version=${{ github.sha }}
      - name: Publish to gh-pages
        working-directory: app/build/web
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          touch .nojekyll
          git init -q -b gh-pages
          git add -A
          git -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "aMaze web preview of ${GITHUB_SHA::8}"
          git push -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
